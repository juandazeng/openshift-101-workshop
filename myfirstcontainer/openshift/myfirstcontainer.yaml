apiVersion: apps/v1
kind: Deployment
metadata:
  name: myfirstcontainer
  labels:
    app: myfirstcontainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myfirstcontainer
  template:
    metadata:
      labels:
        app: myfirstcontainer
    spec:
      containers:
        - name: myfirstcontainer
          image: quay.io/bankingdemo/myfirstcontainer:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: myfirstcontainer
  labels:
    app: myfirstcontainer
spec:
  type: ClusterIP
  selector:
    app: myfirstcontainer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: myfirstcontainer
  labels:
    app: myfirstcontainer
spec:
  to:
    kind: Service
    name: myfirstcontainer
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None